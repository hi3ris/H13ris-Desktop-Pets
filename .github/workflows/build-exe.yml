name: Build Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyQt6 pyinstaller

      - name: Build
        run: >
          pyinstaller --onefile --noconsole --name H13risDesktopPets
          --icon docs/icon.ico h13ris_pets.py

      - name: Smoke test (autostart CLI, no window)
        run: dist\H13risDesktopPets.exe --autostart off

      - uses: actions/upload-artifact@v4
        with:
          name: H13risDesktopPets-windows
          path: dist/H13risDesktopPets.exe

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/H13risDesktopPets.exe --clobber
